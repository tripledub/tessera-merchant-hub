# MH-199: Solid Queue recurring job schedule. Picked up automatically from
# this default path (config/recurring.yml) by Solid Queue's Scheduler
# process — no additional initializer/config is needed for it to be read
# (see Solid Queue::Configuration::DEFAULT_RECURRING_SCHEDULE_FILE_PATH).
# The scheduler process only runs where Solid Queue's supervisor is started
# (production runs it via `bin/jobs` / the Puma plugin per
# config/environments/production.rb); it is inert in development/test
# unless that supervisor is explicitly started.
production:
  kyc_document_expiry_monitoring:
    class: Kyc::DocumentExpiryMonitoringJob
    queue: default
    schedule: every day at 2am
  # MH-412: Solid Queue keeps finished jobs, and their arguments, until told not
  # to. Failed jobs are not touched by this.
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(finished_before: 1.day.ago, sleep_between_batches: 0.3)"
    schedule: every day at 3am
