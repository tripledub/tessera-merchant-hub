## i18n-tasks configuration
# https://github.com/glebm/i18n-tasks

# Keys that are used dynamically at runtime and cannot be statically detected.
ignore_unused:
  # Devise resolves this via User#inactive_message returning :deactivated
  - devise.failure.deactivated
  # Rails form builder resolves these at runtime
  - helpers.submit.applicant_user.*
  # MH-276: comment_status labels are looked up dynamically via
  # t("kyc.documents.comment_status.#{document.comment_status}") by the
  # row-level badge UI landing in a later task on this branch; `open` is
  # the trigger-icon label added by that same later task.
  - kyc.documents.comment_status.requires_follow_up
  - kyc.documents.comment_status.resolved
  - kyc.documents.comments.open
