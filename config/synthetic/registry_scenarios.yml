# Scenarios for Registry::SyntheticClient, the fake registry of the fictional
# jurisdiction Utopia ("xu"), UAT/dev only (MH-310). The company number selects
# the scenario. Everything here is invented: never put a real person's or
# company's details in this file.
#
# Officer names use the Companies House format (SURNAME, Forenames). An
# officer's optional date_of_birth (month, year) is mapped onto the officer's
# registry_directors row and carried onto the principal (MH-303), exactly as
# Companies House publishes it.

XU000001:
  company_name: Utopia Sample Trading Ltd
  status: active
  incorporated_on: "2018-04-02"
  address:
    line1: 1 Specimen Street
    city: Testville
    postcode: UT1 1AA
    country: Utopia
  officers:
    - name: SAMPLE, Riley
      role: director
      appointed_on: "2018-04-02"
    - name: EXAMPLE, Jordan
      role: director
      appointed_on: "2019-06-15"

# Officers named to match the synthetic specimen passports.
XU000002:
  company_name: Utopia Specimen Holdings Ltd
  status: active
  incorporated_on: "2019-01-10"
  address:
    line1: 2 Specimen Street
    city: Testville
    postcode: UT1 1AB
    country: Utopia
  officers:
    - name: TESTPERSON, Alex
      role: director
      appointed_on: "2019-01-10"
      date_of_birth:
        month: 3
        year: 1980
    - name: EXAMPLESON, Morgan Lee
      role: director
      appointed_on: "2019-01-10"
      date_of_birth:
        month: 11
        year: 1991

# MH-313: ownership-structure scenarios — the awkward cases the KYC pipeline
# must handle (chained corporate PSCs, nominee jurisdictions, resigned
# officers, percentages that overshoot 100%). A "pscs" entry mirrors
# "officers": mapped through Registry::SyntheticClient#map_pscs into the same
# shape Registry::CompaniesHouseUkClient#map_pscs produces. A PSC's "country"
# is its correspondence-address country (Companies House shape) — for a
# corporate PSC this is what Kyc::OwnershipFromRegistry checks against
# Kyc::NomineeDetector::NOMINEE_JURISDICTIONS.

# Corporate PSC chain: XU000003's own PSC is another Utopia company
# (XU000010, below), which in turn has an individual PSC — end to end via
# Kyc::PscChainFollower (POST .../trace_psc_chain/:psc_id).
XU000003:
  company_name: Utopia Chain Holdings Ltd
  status: active
  incorporated_on: "2017-05-01"
  address:
    line1: 3 Specimen Street
    city: Testville
    postcode: UT1 1AC
    country: Utopia
  officers:
    - name: CHAIN, Robin
      role: director
      appointed_on: "2017-05-01"
  pscs:
    - name: Utopia Intermediate Holdings Ltd
      kind: corporate-entity-person-with-significant-control
      natures_of_control: [ "ownership-of-shares-75-to-100-percent" ]
      notified_on: "2017-05-01"
      registration_number: XU000010
      country: Utopia

# The intermediate company in XU000003's chain — its own PSC is an
# individual, so the chain terminates here.
XU000010:
  company_name: Utopia Intermediate Holdings Ltd
  status: active
  incorporated_on: "2016-01-01"
  address:
    line1: 10 Specimen Street
    city: Testville
    postcode: UT1 1AJ
    country: Utopia
  officers:
    - name: INTERMEDIATE, Casey
      role: director
      appointed_on: "2016-01-01"
  pscs:
    - name: FINALOWNER, Jordan
      kind: individual-person-with-significant-control
      natures_of_control: [ "ownership-of-shares-75-to-100-percent" ]
      notified_on: "2016-01-01"

# Nominee: the corporate PSC's correspondence address is in Cyprus (CY) — a
# real listed nominee jurisdiction on an obviously-fake Utopia company (see
# MH-313's grooming note; Kyc::NomineeDetector's own jurisdiction list is
# never touched by this).
XU000004:
  company_name: Utopia Nominee Chain Ltd
  status: active
  incorporated_on: "2019-03-01"
  address:
    line1: 4 Specimen Street
    city: Testville
    postcode: UT1 1AD
    country: Utopia
  officers:
    - name: NOMINEE, Drew
      role: director
      appointed_on: "2019-03-01"
  pscs:
    - name: Cyprus Nominee Holdings Ltd
      kind: corporate-entity-person-with-significant-control
      natures_of_control: [ "ownership-of-shares-75-to-100-percent" ]
      notified_on: "2019-03-01"
      registration_number: "HE123456"
      country: CY

# Resigned director: only the active one becomes a principal
# (Kyc::PrincipalsFromRegistry already filters on resigned_on: nil).
XU000005:
  company_name: Utopia Resignation Ltd
  status: active
  incorporated_on: "2015-01-01"
  address:
    line1: 5 Specimen Street
    city: Testville
    postcode: UT1 1AE
    country: Utopia
  officers:
    - name: ACTIVE, Morgan
      role: director
      appointed_on: "2015-01-01"
    - name: RESIGNED, Taylor
      role: director
      appointed_on: "2015-01-01"
      resigned_on: "2020-06-01"

# Ownership overshooting 100%: two PSCs whose own lower-bound percentages
# already sum past 100% (50 + 75 = 125), a plain logical impossibility.
XU000006:
  company_name: Utopia Percentage Ltd
  status: active
  incorporated_on: "2021-02-01"
  address:
    line1: 6 Specimen Street
    city: Testville
    postcode: UT1 1AF
    country: Utopia
  officers:
    - name: OWNER, Jamie
      role: director
      appointed_on: "2021-02-01"
  pscs:
    - name: OWNER, Jamie
      kind: individual-person-with-significant-control
      natures_of_control: [ "ownership-of-shares-50-to-75-percent" ]
      notified_on: "2021-02-01"
    - name: PARTNER, Casey
      kind: individual-person-with-significant-control
      natures_of_control: [ "ownership-of-shares-75-to-100-percent" ]
      notified_on: "2021-02-01"

# MH-312: deterministic error-path scenarios, one company number per
# Registry::FetchResult failure type Registry::CompaniesHouseUkClient can
# produce. An "error" entry has no company data — Registry::SyntheticClient
# returns FetchResult.failure(error_type: ...) for it instead of a success
# profile, and Registry::SyntheticClient.scenario_numbers excludes these from
# the success-scenario list.
#
# not_found (XU000404) needs no entry here — any company number absent from
# this file already returns not_found, the same as a real 404.
XU000401:
  error: unauthorized

XU000429:
  error: rate_limited

XU000503:
  error: unavailable
