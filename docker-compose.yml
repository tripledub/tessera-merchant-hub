services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: merchanthub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: merchanthub_development
    ports:
      - "5433:5432"  # 5433 to avoid clashing with tessera-core on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  anycable-go:
    image: anycable/anycable-go:latest
    ports:
      - "8080:8080"
    environment:
      ANYCABLE_HOST: 0.0.0.0
      ANYCABLE_PORT: 8080
      ANYCABLE_RPC_HOST: host.docker.internal:50051
      ANYCABLE_REDIS_URL: redis://redis:6379/1
      ANYCABLE_SECRET: ${ANYCABLE_SECRET:-changeme-dev-secret}
    depends_on:
      - redis

  web:
    build: .
    command: bin/rails server -b 0.0.0.0
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://merchanthub:password@db:5432/merchanthub_development
      REDIS_URL: redis://redis:6379/1
      ANYCABLE_SECRET: ${ANYCABLE_SECRET:-changeme-dev-secret}
      TESSERA_CORE_URL: http://host.docker.internal:4000
      TESSERA_INTERNAL_API_KEY: changeme
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
